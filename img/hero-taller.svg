<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" role="img" aria-label="Auto azul recién revisado en el taller, con tarjetas de turno confirmado y presupuesto aprobado">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e2a44"/>
      <stop offset="100%" stop-color="#14203a"/>
    </linearGradient>
    <linearGradient id="auto" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b7bff"/>
      <stop offset="100%" stop-color="#0052ff"/>
    </linearGradient>
    <radialGradient id="luz" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4d86ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4d86ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Panel de fondo -->
  <rect x="40" y="60" width="560" height="400" rx="36" fill="url(#panel)" stroke="#2c3a58" stroke-width="2"/>
  <ellipse cx="320" cy="250" rx="260" ry="190" fill="url(#luz)"/>

  <!-- Herramientas colgadas -->
  <g stroke="#3a4a6b" stroke-width="2" fill="none" opacity="0.9">
    <rect x="80" y="96" width="180" height="70" rx="14"/>
    <path d="M110 112 v38 M140 112 v38 M170 112 v38 M200 112 v38 M230 112 v38" stroke-linecap="round"/>
  </g>
  <g fill="#4d86ff" opacity="0.85">
    <circle cx="110" cy="152" r="6"/><circle cx="140" cy="152" r="6"/><circle cx="170" cy="152" r="6"/><circle cx="200" cy="152" r="6"/><circle cx="230" cy="152" r="6"/>
  </g>

  <!-- Piso -->
  <rect x="88" y="392" width="464" height="12" rx="6" fill="#2c3a58"/>
  <ellipse cx="320" cy="392" rx="200" ry="14" fill="#020617" opacity="0.35"/>

  <!-- Auto -->
  <g filter="url(#sombra)">
    <path d="M150 352 C150 322 172 306 204 300 L244 258 C256 246 272 240 290 240 L380 240 C400 240 416 248 428 262 L462 300 C496 304 512 320 512 346 L512 360 C512 368 506 374 498 374 L164 374 C156 374 150 368 150 360 Z" fill="url(#auto)"/>
    <path d="M254 298 L280 268 C286 261 294 258 302 258 L330 258 L330 298 Z" fill="#cfe0ff"/>
    <path d="M346 298 L346 258 L376 258 C386 258 394 262 400 269 L424 298 Z" fill="#cfe0ff"/>
    <rect x="494" y="322" width="18" height="12" rx="4" fill="#fde68a"/>
    <rect x="150" y="324" width="14" height="10" rx="3" fill="#fca5a5"/>
    <rect x="290" y="316" width="26" height="5" rx="2.5" fill="#cfe0ff" opacity="0.8"/>
    <rect x="374" y="316" width="26" height="5" rx="2.5" fill="#cfe0ff" opacity="0.8"/>
  </g>
  <g>
    <circle cx="232" cy="374" r="34" fill="#0f172a"/><circle cx="232" cy="374" r="16" fill="#cbd5e1"/><circle cx="232" cy="374" r="6" fill="#0f172a"/>
    <circle cx="432" cy="374" r="34" fill="#0f172a"/><circle cx="432" cy="374" r="16" fill="#cbd5e1"/><circle cx="432" cy="374" r="6" fill="#0f172a"/>
  </g>

  <!-- Destellos de "auto listo" -->
  <g stroke="#fde68a" stroke-width="4" stroke-linecap="round">
    <path d="M520 236 v18 M511 245 h18"/>
    <path d="M140 250 v12 M134 256 h12"/>
  </g>

  <!-- Tarjeta: turno confirmado -->
  <g transform="translate(372,92)" filter="url(#sombra)">
    <rect width="236" height="84" rx="18" fill="#ffffff"/>
    <circle cx="40" cy="42" r="20" fill="#d1fae5"/>
    <path d="M31 42 l6 6 l12 -13" fill="none" stroke="#047857" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="36" fill="#0f172a" font-family="'Plus Jakarta Sans',Arial,sans-serif" font-weight="700" font-size="16">Turno confirmado</text>
    <text x="72" y="58" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="13">Mañana · 9:00 hs</text>
  </g>

  <!-- Tarjeta: presupuesto aprobado -->
  <g transform="translate(16,404)" filter="url(#sombra)">
    <rect width="250" height="84" rx="18" fill="#ffffff"/>
    <rect x="20" y="22" width="40" height="40" rx="12" fill="#e6eeff"/>
    <path d="M32 34 h16 M32 42 h16 M32 50 h10" stroke="#0052ff" stroke-width="3.5" stroke-linecap="round"/>
    <text x="76" y="38" fill="#0f172a" font-family="'Plus Jakarta Sans',Arial,sans-serif" font-weight="700" font-size="16">Presupuesto claro</text>
    <text x="76" y="60" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="13">Aprobado antes de empezar</text>
  </g>

  <!-- Insignia: llave -->
  <g transform="translate(560,300)" filter="url(#sombra)">
    <circle r="36" fill="#fbbf24"/>
    <path d="M-12 14 L6 -4 M2 -16 a12 12 0 1 0 14 14 l-7 -1 l-2 -6 l-6 -2 Z" fill="none" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
