      <circle cx="98" cy="0" r="6"/><circle cx="-98" cy="0" r="6"/><circle cx="0" cy="98" r="6"/><circle cx="0" cy="-98" r="6"/>
      <circle cx="69" cy="69" r="6"/><circle cx="-69" cy="69" r="6"/><circle cx="69" cy="-69" r="6"/><circle cx="-69" cy="-69" r="6"/>
    </g>
