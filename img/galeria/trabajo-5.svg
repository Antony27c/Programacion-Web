    <g fill="none" stroke="#0052ff" stroke-width="12" stroke-linecap="round">
      <path d="M-38 55 L38 78"/><path d="M-38 92 L38 115"/><path d="M-38 129 L38 152"/><path d="M-38 166 L38 189"/>
