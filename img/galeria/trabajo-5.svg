    <text x="56" y="20" fill="#94a3b8" font-family="Arial,sans-serif" font-weight="700" font-size="11" letter-spacing="2">BOXLY · SALTA</text>
    <text x="56" y="36" fill="#e2e8f0" font-family="Arial,sans-serif" font-weight="700" font-size="14">AMORTIGUADORES + ALINEACIÓN · SANDERO</text>
  </g>
  <!-- Dos amortiguadores -->
  <g transform="translate(230,115)">
